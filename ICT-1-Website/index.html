<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ICT-1 | Terminal Hub</title>

    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>

    <link rel="stylesheet" href="css/main.css"/>
    <link rel="stylesheet" href="css/animations.css"/>
</head>
<body>

<div class="cyber-grid"></div>
<div class="scanlines"></div>

<canvas id="matrixCanvas"></canvas>

<button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle Interface Mode">
    <img id="toggleIcon" src="assets/sun.png" alt="Theme Icon"/>
</button>

<main class="terminal-card" id="loginCard">
    <header class="terminal-header">
        <div class="matrix-brand">
            <i class="fas fa-terminal"></i>
            <h1 id="terminalTitle">SYSTEM.INIT // ICT-1</h1>
        </div>

        <button id="rosterToggle" class="roster-btn-inline hidden" aria-label="Open Class Roster">
            <img id="rosterIcon" src="assets/users.png" alt="Roster Icon"/>
        </button>

        <span class="status-badge" id="nodeBadge">SECURE_NODE</span>
    </header>

    <section class="login-auth-zone" id="authPanel">
        <div class="terminal-instruction">
            <p class="blink-text">> IDENTITY VERIFICATION REQUIRED...</p>
        </div>

        <div class="cyber-input-group">
            <label for="usernameInput"><i class="fas fa-user-shield"></i> USERNAME :</label>
            <input type="text" id="usernameInput" placeholder="ENTER LOGICAL ID" autocomplete="off"/>
        </div>

        <div class="cyber-input-group">
            <label for="passwordInput"><i class="fas fa-key"></i> ACCESS_KEY :</label>
            <input type="password" id="passwordInput" placeholder="ENTER ACCESS KEY"/>
        </div>

        <button class="cyber-btn" id="loginBtn">
            <span class="btn-glitch-text">EXECUTE_LOGIN()</span>
        </button>

        <div class="terminal-status-output">
            <span id="authStatus">AWAITING_INPUT...</span>
        </div>
    </section>

    <section class="protected-content hidden" id="galleryWrapper">
        <div class="banner-frame">
            <div class="banner-scanline"></div>
            <img src="assets/class_pic.jpg" alt="ICT-1 Master Roster Photo" class="banner-img"/>
            <div class="banner-tag">HOST_NODE_DIRECT: ICT-1_EST_2026</div>
        </div>

        <h2 class="welcome-banner">> ACCESS GRANTED. WELCOME TO THE INNER MATRIX.</h2>
        <div class="matrix-grid" id="memoryGrid"></div>

        <footer class="controls">
            <button class="cyber-btn-secondary" id="logoutBtn">TERMINATE_SESSION</button>
        </footer>
    </section>

    <section class="roster-zone hidden" id="rosterZone">
        <div class="terminal-instruction">
            <p class="blink-text">> PARSING ARCHIVED STUDENT PROFILES...</p>
        </div>

        <div class="roster-grid" id="rosterGrid"></div>

        <footer class="controls">
            <button class="cyber-btn-secondary" id="backToMainBtn">RETURN_TO_MAIN()</button>
        </footer>
    </section>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
